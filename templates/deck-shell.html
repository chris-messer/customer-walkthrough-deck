<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title><!-- DECK_TITLE --></title>
  <style>
    :root {
      --ink: #1b3139;
      --muted: #52666d;
      --dim: #75868b;
      --oat: #f9f7f4;
      --oat-2: #eeede9;
      --panel: #ffffff;
      --line: #d7d6d1;
      --signal: #ff3621;
      --blue: #2272b4;
      --green: #00a972;
      --danger: #98102a;
      --amber: #b06000;
      --display: "DM Sans", "Avenir Next", "Inter", sans-serif;
      --body: "Inter", "DM Sans", "Avenir Next", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--oat); color: var(--ink); }
    body {
      font-family: var(--body);
      background:
        radial-gradient(circle at 88% 8%, rgba(255, 54, 33, .07), transparent 28%),
        linear-gradient(135deg, #f9f7f4 0%, #f5f3ef 58%, #eeede9 100%);
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: .5;
      background-image:
        linear-gradient(rgba(27,49,57,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27,49,57,.014) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .deck { position: relative; width: 100%; height: 100%; }
    .slide {
      position: absolute; inset: 0;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: clamp(34px, 5vw, 76px) clamp(44px, 7vw, 112px) 32px;
      opacity: 0; visibility: hidden; transform: translateX(28px);
      transition: opacity .32s ease, transform .42s cubic-bezier(.2,.75,.2,1), visibility .32s;
    }
    .slide.active { opacity: 1; visibility: visible; transform: translateX(0); z-index: 2; }
    .slide.past { transform: translateX(-28px); }
    .slide::after {
      content: ""; position: absolute; right: 0; top: 0; width: 28%; height: 4px;
      background: var(--signal);
    }
    .eyebrow {
      display: flex; align-items: center; gap: 14px;
      color: var(--signal); text-transform: uppercase; letter-spacing: .18em;
      font: 700 13px/1 var(--display);
    }
    .eyebrow .num {
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 1px solid rgba(255,54,33,.38); border-radius: 50%;
      letter-spacing: 0; color: var(--ink);
    }
    .content { align-self: center; width: 100%; max-width: 1450px; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--display); letter-spacing: -.025em; }
    h1 { font-size: clamp(62px, 8.1vw, 128px); line-height: .9; max-width: 1100px; margin-bottom: 30px; }
    h2 { font-size: clamp(44px, 5vw, 76px); line-height: .98; margin-bottom: 28px; max-width: 1180px; }
    h3 { font-size: clamp(23px, 2vw, 34px); line-height: 1.08; margin-bottom: 12px; }
    .lead { font-size: clamp(21px, 2.1vw, 32px); line-height: 1.36; color: #40575f; max-width: 1120px; }
    .quiet { color: var(--muted); }
    .signal { color: var(--signal); }
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    .brand { color: var(--ink); font-weight: 700; }
    .counter { font-variant-numeric: tabular-nums; }
    .progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--signal); z-index: 20; transition: width .3s ease; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 48px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    .rule-block { border-top: 1px solid var(--line); padding-top: 20px; }
    .rule-block .kicker { color: var(--signal); font: 700 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
    .rule-block p, .rule-block li { color: var(--muted); font-size: clamp(16px, 1.35vw, 22px); line-height: 1.42; }
    .agenda { counter-reset: item; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 64px; max-width: 1200px; }
    .agenda-item { counter-increment: item; display: grid; grid-template-columns: 54px 1fr; gap: 18px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .agenda-item::before { content: "0" counter(item); color: var(--signal); font: 700 24px/1 var(--display); }
    .agenda-item b { display: block; font: 700 23px/1.1 var(--display); margin-bottom: 6px; }
    .agenda-item span { color: var(--muted); font-size: 16px; line-height: 1.35; }
    .title-slide .content { align-self: end; padding-bottom: 5vh; }
    .title-slide .overline { color: var(--signal); font: 700 15px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 24px; }
    .title-slide .subtitle { max-width: 900px; color: var(--muted); font-size: clamp(22px, 2.3vw, 34px); line-height: 1.35; }
    .title-slide .meta { margin-top: 45px; display: flex; gap: 34px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
    .nav-hint { position: fixed; right: 24px; bottom: 18px; z-index: 21; color: rgba(187,184,180,.5); font-size: 11px; letter-spacing: .08em; display: flex; gap: 14px; align-items: center; }
    .notes-link {
      appearance: none; border: 1px solid rgba(255,54,33,.35); background: rgba(255,255,255,.88);
      color: var(--ink); font: 700 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    .notes-link:hover { border-color: var(--signal); color: var(--signal); }
    /* Canonical three-level position rail — structure and behavior mirror the
       graph SME deck. Keep the box pinned; active state may change its contents,
       never its geometry. See templates/rail-snippet.html for annotated CSS. */
    .rail {
      --rail-w: 1060px; --rail-gutter: clamp(34px, 4.8vw, 88px);
      position: fixed; z-index: 15; top: clamp(24px, 3.2vw, 56px);
      left: calc(100vw - var(--rail-gutter) - var(--rail-w)); right: var(--rail-gutter);
      height: 34px; min-height: 34px; max-height: 34px;
      display: flex; align-items: center; justify-content: flex-start; gap: 13px; overflow: hidden;
    }
    .rail.is-hidden { display: none; }
    .rail-sec { display: flex; align-items: center; gap: 9px; flex: none; }
    .rail-sname {
      position: relative; appearance: none; background: none; cursor: pointer; border: 0;
      border-radius: 2px; padding: 0 0 7px; white-space: nowrap; flex: none;
      font: 700 9.5px/1 var(--display); letter-spacing: .13em; text-transform: uppercase;
      color: var(--dim); transition: color .22s ease;
    }
    .rail-sname::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: rgba(27,49,57,.09); border-radius: 2px;
    }
    .rail-fill {
      position: absolute; left: 0; bottom: 0; height: 2px; width: 0; z-index: 1;
      background: rgba(82,102,109,.5); border-radius: 2px; transition: width .3s ease, background .22s ease;
    }
    .rail-sec.is-past .rail-sname { color: var(--muted); }
    .rail-sec.is-open .rail-sname { color: var(--signal); }
    .rail-sec.is-open .rail-fill { background: var(--signal); }
    .rail-sname:hover { color: var(--ink); }
    .rail-sname:focus-visible, .rail-uname:focus-visible { outline: 2px solid rgba(34,114,180,.45); outline-offset: 3px; }
    .rail-subs { display: none; }
    .rail-sec.is-open .rail-subs { display: flex; align-items: center; gap: 8px; flex: none; }
    .rail-sec.is-open .rail-subs::before {
      content: "\203a"; flex: none; margin-right: -1px; font: 400 13px/1 var(--display); color: rgba(255,54,33,.55);
    }
    .rail-sub {
      display: flex; align-items: center; gap: 6px; flex: none; padding: 3px 0;
      border: 1px solid transparent; border-radius: 999px; transition: background .22s ease, border-color .22s ease;
    }
    .rail-sub.is-open { background: rgba(255,255,255,.75); border-color: var(--line); padding: 3px 7px 3px 10px; }
    .rail-uname {
      appearance: none; border: 0; background: none; cursor: pointer; flex: none; padding: 0;
      white-space: nowrap; border-radius: 2px; font: 500 11.5px/1 var(--body); color: var(--dim);
    }
    .rail-sub.is-past .rail-uname { color: var(--muted); }
    .rail-sub.is-open .rail-uname { color: var(--ink); font-weight: 600; }
    .rail-pips { display: none; }
    .rail-sub.is-open .rail-pips { display: flex; align-items: center; }
    .rail-pip {
      appearance: none; border: 0; background: none; cursor: pointer; width: 12px; height: 18px;
      padding: 0; border-radius: 4px; display: grid; place-items: center;
    }
    .rail-pip i { width: 5px; height: 5px; border-radius: 50%; background: rgba(27,49,57,.22); }
    .rail-pip.is-past i { background: rgba(82,102,109,.62); }
    .rail-pip.is-here i { background: var(--signal); box-shadow: 0 0 0 3px rgba(255,54,33,.18); }
    .rail-pip:focus-visible { outline: 2px solid rgba(34,114,180,.45); }
    .rail-sec.is-appendix .rail-sname { padding-bottom: 0; font-size: 8.5px; letter-spacing: .1em; }
    .rail-sec.is-appendix .rail-sname::after, .rail-sec.is-appendix .rail-fill { display: none; }
    /* Optional: .launch-demo fixed top-right CTA — add only when a live app URL exists */
    @media (max-width: 1480px) {
      .rail { left: auto; justify-content: flex-end; gap: 10px; }
      .rail-sec.is-open .rail-subs { display: none; }
    }
    @media (max-width: 900px) {
      .slide { padding: 28px 30px 24px; }
      .agenda { grid-template-columns: 1fr; }
      .rail { display: none; }
    }
  </style>
</head>
<body>
  <main class="deck" aria-live="polite">
    <!-- SLIDE 1: Title — replace placeholders -->
    <section class="slide title-slide active" aria-label="Title">
      <div></div>
      <div class="content">
        <div class="overline"><!-- CUSTOMER · Theme --></div>
        <h1><!-- Product<br><span class="signal">Name</span> --></h1>
        <p class="subtitle"><!-- One-line value prop --></p>
        <div class="meta"><span>Customer walkthrough</span><span><!-- Month Year --></span><span><!-- Audience --></span></div>
      </div>
      <div class="footer"><span class="brand"><!-- Databricks × Customer --></span><span class="counter">01 / NN</span></div>
    </section>

    <!-- SLIDE 2: Agenda example — duplicate/adapt .slide sections; keep counters in sync with notes -->
    <section class="slide" aria-label="Agenda">
      <div class="eyebrow"><span class="num">02</span> Agenda</div>
      <div class="content">
        <h2>What this walkthrough covers.</h2>
        <div class="agenda">
          <div class="agenda-item"><div><b><!-- Beat --></b><span><!-- One line --></span></div></div>
        </div>
      </div>
      <div class="footer"><span class="brand"><!-- Deck brand --></span><span class="counter">02 / NN</span></div>
    </section>

    <!-- Add more <section class="slide">…</section> here. Update every counter to MM / TOTAL. -->
  </main>

  <div class="progress" aria-hidden="true"></div>
  <nav class="rail" aria-label="Where you are in the deck"></nav>
  <div class="nav-hint">
    <button type="button" class="notes-link" id="open-notes">Open speaker notes</button>
    <span>← → · Space</span>
  </div>

  <script>
    (() => {
      // REPLACE slug in both files to match presentations/{slug}-*.html
      const CHANNEL = '{slug}-deck';
      const STORAGE_KEY = '{slug}-slide';
      const NOTES_FILE = '{slug}-speaker-notes.html';
      const NOTES_WINDOW = '{slug}-notes';

      const slides = [...document.querySelectorAll('.slide')];
      const progress = document.querySelector('.progress');
      const rail = document.querySelector('.rail');
      // One hierarchy declaration; every 0-based slide index appears once.
      const OUTLINE = [
        ['Overview', [['Opening', [0, 1]]]],
        // Add sections/subsections in deck order. Keep names to one or two words.
      ];
      const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(CHANNEL) : null;
      let index = 0;
      let touchStartX = null;
      let lastNavAt = 0;
      let applyingRemote = false;

      // Per-slide interactive visuals, if any: index -> { enter, teardown }.
      // setup(slide) runs once; enter() runs when the slide becomes visible,
      // because widths are meaningless until then. See interactive-visuals.md.
      const VIZ = {};
      function registerViz(i, setup) { VIZ[i] = setup(slides[i]) || {}; }

      function buildRail() {
        const seen = new Set(), order = [], failures = [];
        let html = '';
        for (const [section, subs] of OUTLINE) {
          if (!subs.length) failures.push(`section "${section}" has no subsections`);
          const all = subs.flatMap(([, indices]) => indices);
          for (const i of all) {
            if (seen.has(i)) failures.push(`slide ${i} is listed twice`);
            if (!slides[i]) failures.push(`slide ${i} does not exist`);
            seen.add(i); order.push(i);
          }
          const appendix = /^appendix$/i.test(section) ? ' is-appendix' : '';
          html += `<div class="rail-sec${appendix}" data-from="${all[0]}" data-to="${all.at(-1)}">`
            + `<button type="button" class="rail-sname" data-slide="${all[0]}">${section}<i class="rail-fill"></i></button>`
            + '<div class="rail-subs">';
          for (const [sub, indices] of subs) {
            if (!indices.length) failures.push(`subsection "${section} / ${sub}" has no slides`);
            if (!indices.every((n, k) => !k || n === indices[k - 1] + 1)) failures.push(`subsection "${section} / ${sub}" is not contiguous`);
            html += `<div class="rail-sub" data-from="${indices[0]}" data-to="${indices.at(-1)}">`
              + `<button type="button" class="rail-uname" data-slide="${indices[0]}">${sub}</button><div class="rail-pips">`
              + indices.map(i => {
                  const label = slides[i]?.querySelector('h1, h2')?.textContent.trim() || sub;
                  return `<button type="button" class="rail-pip" data-slide="${i}" title="${String(i + 1).padStart(2, '0')} · ${label}" aria-label="Slide ${i + 1} of ${slides.length}: ${label}"><i></i></button>`;
                }).join('')
              + '</div></div>';
          }
          html += '</div></div>';
        }
        slides.forEach((_, i) => { if (!seen.has(i)) failures.push(`slide ${i} is not in OUTLINE`); });
        if (order.some((n, k) => k && n !== order[k - 1] + 1)) failures.push('OUTLINE is not in deck order');
        if (failures.length) {
          const message = `rail: invalid OUTLINE\n- ${failures.join('\n- ')}`;
          console.error(message);
          throw new Error(message);
        }
        rail.innerHTML = html;
      }

      function paintRail(current) {
        rail.classList.toggle('is-hidden', !slides[current]?.querySelector('.eyebrow'));
        const mark = (el) => {
          const from = Number(el.dataset.from), to = Number(el.dataset.to);
          const open = current >= from && current <= to;
          el.classList.toggle('is-open', open);
          el.classList.toggle('is-past', current > to);
          return { from, to, open };
        };
        rail.querySelectorAll('.rail-sec').forEach(sec => {
          const { from, to, open } = mark(sec);
          const done = open ? (current - from + 1) / (to - from + 1) : current > to ? 1 : 0;
          sec.querySelector('.rail-fill').style.width = `${done * 100}%`;
          sec.querySelector('.rail-sname').setAttribute('aria-current', open ? 'step' : 'false');
        });
        rail.querySelectorAll('.rail-sub').forEach(sub => mark(sub));
        rail.querySelectorAll('.rail-pip').forEach(pip => {
          const n = Number(pip.dataset.slide);
          pip.classList.toggle('is-here', n === current);
          pip.classList.toggle('is-past', n < current);
          pip.setAttribute('aria-current', n === current ? 'true' : 'false');
        });
      }

      function broadcastSlide(i) {
        try { localStorage.setItem(STORAGE_KEY, String(i)); } catch (_) {}
        if (bc) bc.postMessage({ slideIndex: i, source: 'deck' });
      }

      function show(next, opts = {}) {
        VIZ[index]?.teardown?.(slides[index]);
        index = Math.max(0, Math.min(slides.length - 1, next));
        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === index);
          slide.classList.toggle('past', i < index);
          slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
        });
        progress.style.width = `${((index + 1) / slides.length) * 100}%`;
        paintRail(index);
        history.replaceState(null, '', `#${index + 1}`);
        if (!opts.silent && !applyingRemote) broadcastSlide(index);
        const shown = index;
        requestAnimationFrame(() => { if (index === shown) VIZ[shown]?.enter?.(slides[shown]); });
      }

      function applyRemote(i) {
        if (!Number.isFinite(i) || i === index) return;
        applyingRemote = true;
        show(i, { silent: true });
        applyingRemote = false;
      }

      if (bc) {
        bc.onmessage = (event) => {
          const i = event?.data?.slideIndex;
          if (typeof i === 'number') applyRemote(i);
        };
      }
      window.addEventListener('storage', (event) => {
        if (event.key !== STORAGE_KEY || event.newValue == null) return;
        applyRemote(Number(event.newValue));
      });

      document.querySelector('#open-notes')?.addEventListener('click', () => {
        const url = new URL(NOTES_FILE, window.location.href);
        url.hash = String(index + 1);
        window.open(url.toString(), NOTES_WINDOW, 'width=520,height=900,menubar=no,toolbar=no,location=no,status=no');
        broadcastSlide(index);
      });

      // Arrow keys must keep working after a slide control is clicked, but Space
      // still belongs to a focused button so it can activate it.
      const swallowsKey = (target, key) =>
        target.closest('input, textarea, select') || (key === ' ' && target.closest('button'));

      // Capture phase: in-slide handlers stop propagation, so a bubbling
      // listener would never see the click. Blurring matters because a button
      // holding focus swallows the next Space, which is a step key.
      document.addEventListener('click', (event) => {
        const btn = event.target.closest('.deck button, .rail button');
        if (btn) setTimeout(() => btn.blur(), 0);
      }, true);
      rail.addEventListener('click', (event) => {
        const target = event.target.closest('[data-slide]');
        if (target) show(Number(target.dataset.slide));
      });

      document.addEventListener('keydown', (event) => {
        if (swallowsKey(event.target, event.key)) return;
        if (['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp', 'Home', 'End'].includes(event.key)) {
          event.preventDefault();
        }
      });
      document.addEventListener('keyup', (event) => {
        if (swallowsKey(event.target, event.key)) return;
        const isStepKey = ['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp'].includes(event.key);
        const now = Date.now();
        if (isStepKey && (event.repeat || now - lastNavAt < 180)) return;
        if (isStepKey) lastNavAt = now;
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(index + 1);
        else if (['ArrowLeft', 'PageUp'].includes(event.key)) show(index - 1);
        else if (event.key === 'Home') show(0);
        else if (event.key === 'End') show(slides.length - 1);
      });

      document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
      document.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const delta = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 55) show(index + (delta < 0 ? 1 : -1));
        touchStartX = null;
      }, { passive: true });

      // Redraw the active slide's visual after a resize; SVG widths change.
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => VIZ[index]?.enter?.(slides[index]), 220);
      });

      // Register interactive slides here, before the first show():
      // registerViz(4, (slide) => { /* bind controls */ return { enter() {} }; });

      buildRail();
      let start = Number(location.hash.slice(1)) - 1;
      if (!Number.isFinite(start) || start < 0) {
        try { start = Number(localStorage.getItem(STORAGE_KEY)); } catch (_) { start = 0; }
      }
      show(Number.isFinite(start) && start >= 0 ? start : 0);
    })();
  </script>
</body>
</html>
